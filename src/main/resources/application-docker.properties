# Docker-specific configuration
spring.application.name=FinTrack

# Database configuration for Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/fintrack_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=fintrack
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://postgres:5432/fintrack_db}
spring.flyway.user=${SPRING_FLYWAY_USER:admin}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:admin}
spring.flyway.baseline-description=init
spring.flyway.baseline-version=0
spring.flyway.batch=true

# JWT TOKENS
jwt.secret=${JWT_SECRET:MySecretJWTKeyForFinTrackApplicationThatIsLongerThan32BytesAndSecure2025!}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Security Configuration
app.security.max-login-attempts=5
app.security.account-lockout-duration=30

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
# Disable mail health check to prevent authentication errors with placeholder credentials
management.health.mail.enabled=false
