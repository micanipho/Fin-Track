spring.application.name=FinTrack

# Test Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for tests
spring.flyway.enabled=false

# JWT Configuration for tests
jwt.secret=MyTestSecretJWTKeyForFinTrackApplicationThatIsLongerThan32BytesAndSecure2025!
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Test Email Configuration (disabled)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test

# Application Configuration for tests
app.frontend.url=http://localhost:3000

# Security Configuration for tests
app.security.max-login-attempts=5
app.security.account-lockout-duration=30

# Logging Configuration
logging.level.za.co.fintrack=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.mail=DEBUG
